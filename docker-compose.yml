version: '3.5'

services:
  server:
    image: neosy/elengrab
    ports:
      - 8080:8080
    environment:
      TZ: "Europe/Moscow"
    volumes:
      - downloads:/app_n/downloads
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - "node.role==manager"
          # - "node.hostname==HostName"

volumes:
  downloads:
