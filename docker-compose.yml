version: '3.5'

services:
  watcher:
    image: ${APP_IMG}
    ports:
      - ${HTTP_PORT}:8080
    environment:
      TZ: "Europe/Moscow"
      WATCHER_TELEGRAM_CHAT_ID:
      REDIS_ADDRESSES:
      REDIS_PREFIX_KEY:
    secrets: 
      - npulse_telegram_token
    #volumes:
    #  - app_log:/app_n/log
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - "node.role==manager"
          #- "node.hostname==${NODE_HOSTNAME}"

secrets:  
  npulse_telegram_token:
    external: true

