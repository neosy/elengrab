<div class="div-grab-result-item inprogress {{ .ItemFade }}" 
    {{ if .IsItemHTMXOptionRepeat }}
        hx-get="{{.PathFileRow}}"
        hx-trigger="every 1000ms"
        hx-target="this"
        hx-swap="outerHTML"
    {{end }}>
    <div class="result-left">
        <span class="result-youtube-channel-avatar">
            <img class="img-youtube-channel-avatar" src="/ui/downloader/channel/{{ .YoutubeChannelID }}/avatar" alt="Channel avatar">
        </span>
        <span class="result-youtube-url {{.ResultYoutubeUrlFade}}">
            <a href="{{ .YoutubeURL }}" target="_blank">{{ .YoutubeTitle }}</a>
        </span>
    </div>
    <div class="result-right">
        <span class="result-separator first">•</span>
        <div class="div-result-size">
            <span class="result-size {{.ResultSizeFade}}" data-id="size">{{ .FileSize }}</span>
        </div>
        <span class="result-separator">•</span>
        <div class="div-result-format">
            <span class="result-format {{.ResultFormatFade}}" data-id="format">{{ .Format }}</span>
        </div>
        <span class="result-separator">•</span>
        <div class="div-result-delete">
            <button class="btn-delete-row"
                hx-delete="{{ .DeleteURL }}"
                hx-target="closest .div-grab-result-item"
                hx-swap="outerHTML swap:0.5s">
                {{ .GrabResultItemDeleteIcon }}
            </button>            
        </div>
        <span class="result-separator">•</span>
        <div class="div-result-status" title="{{ .GrabResultItemStatusText }}">
        {{ if .IsItemSpiner }}
            <div class="item-result-spinner"></div>
        {{ else }}
            {{ .GrabResultItemStatusHtml }}
        {{ end }}
        </div>
        </div>
    </div>
</div>
