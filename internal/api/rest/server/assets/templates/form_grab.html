{{define "form-grab"}}
      <form id="form-grab"
            hx-post="{{.PathDownloaderGrab}}"
            hx-target="#grab-result-item-replaceme"
            hx-include="#mediaURL, [name='formatType']"
            hx-swap="outerHTML">
        <div class="div-grab-area">
          <input class="input-grab" type="text" id="mediaURL" name="mediaURL" placeholder="{{ .InputGrabPlaceholder }}" maxlength="255">
          <div class="div-button-input-action">
            <button type="button" class="button-input-action" id="inputActionBtn"></button>
          </div>
          <div class="div-button-get">
            <button type="submit" class="button-grab-get" title="Download media">Get</button>
          </div>
        </div>
        <div class="div-select-options">
          <div class="div-select-option">
            <span class="select-option-label">Quality</span>
            <select name="quality-codec" title="Select your preferred video/audio quality or codec">
              <option value="best" selected>Best</option>
              <option value="only_audio">Only audio</option>
              <option value="h264">Video H.264</option>
              <option value="h265">Video H.265</option>
              <option value="av1">Video AV1</option>
            </select>
            <select name="quality-resolution" title="Select the video resolution you prefer">
              <option value="empty" hidden>Max</option>
              <option value="max" selected>Max</option>
              <option value="1080">1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
              <option value="360">360p</option>
            </select>
          </div>
          <div class="div-select-option">
            <span class="select-option-label">Format</span>
            <select name="format" title="Select the desired output format for video or audio">
              <option value="auto" selected>Auto</option>
              <optgroup label="Video">
                <option value="mp4">MP4</option>
                <option value="webm">WebM</option>
              </optgroup>
              <optgroup label="Audio">
                <option value="mp3">MP3</option>
                <option value="m4a">M4A</option>
                <option value="flac">FLAC</option>
                <option value="opus">OPUS</option>
              </optgroup>
            </select>
          </div>
        </div>
      </form>
{{end}}
