{{- define "auth-login-page" -}}
    {{- template "auth" . }}
{{- end -}}

{{- define "header" -}}
    <div class="user-menu">
      {{- template "theme-switcher" . }}
    </div>
{{- end -}}

{{- define "content" -}}
    <div class="main_login">
        <div class="main-header">
          <a class="main-header__link" href="/">
            <img class="main-header__logo-image" src="{{.BasePaths.StaticImages}}/logo-512.png">
            <h1 class="main-header__title">{{.BaseValues.Header}}</h1>
          </a>
        </div>
        <h2>Enter login and password</h2>
        <form id="authForm"
              hx-post="{{.BasePaths.AuthLogin}}"
              hx-target="#error"
              hx-swap="innerHTML">
            <input type="text" name="login" placeholder="Login" required value="">
            <input type="password" name="password" placeholder="Password" required>
            <div class="error" id="error"></div>
            <button type="submit">Login</button>
        </form>
    </div>    
{{- end -}}
