{{- define "auth-register-page" }}
    {{- template "auth" . }}
{{- end }}

{{- define "header" }}
    <div class="user-menu">
      {{- template "theme-switcher" . }}
    </div>
{{- end }}

{{- define "content" }}
    <div class="main_register">
        <div class="main-header">
          <a class="main-header__link" href="/">
            <img class="main-header__logo-image" src="{{.BasePaths.StaticImages}}/logo-512.png">
            <h1 class="main-header__title">{{.BaseValues.Header}}</h1>
          </a>
        </div>
        <h2>Registration</h2>
        <form id="authForm"
              hx-post="{{.BasePaths.AuthRegister}}"
              hx-target="#error"
              hx-swap="innerHTML">
            <input type="text" name="login" placeholder="Login" required value="">
            <input type="password" id="password" name="password" placeholder="Password" required>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
            <div class="error" id="error"></div>
            <button type="submit">Register</button>
        </form>
    </div>    
{{- end }}
