{{- define "auth" }}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ .BaseValues.Title }}</title>
  <meta name="description" content="{{ .BaseValues.Description }}">
  <script>
    try {
      if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches)){
        document.documentElement.classList.add('dark');
      }
    } catch(e){}
  </script>
  {{- range .Paths.Css }}
  <link rel="stylesheet" href="{{.}}">
  {{- end }}
  <link rel="manifest" href="{{.BasePaths.StaticPwa}}/manifest.json">
  <link rel="icon" type="image/svg+xml" href="{{.BasePaths.StaticIcons}}/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="{{.BasePaths.StaticImages}}/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="{{.BasePaths.StaticImages}}/favicon-48.png">
  <link rel="icon" type="image/png" sizes="64x64" href="{{.BasePaths.StaticImages}}/favicon-64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{.BasePaths.StaticImages}}/android-chrome-rounded-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="{{.BasePaths.StaticImages}}/android-chrome-rounded-512x512.png">
  <link rel="icon" type="image/x-icon" href="{{.BasePaths.StaticImages}}/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="{{.BasePaths.StaticImages}}/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="theme-color" id="theme-color-meta" content="#171717">
  {{- if .Paths.JsImportMapJSON }}
  <script type="importmap">
  {{- .Paths.JsImportMapJSON }}
  </script>
  {{- end }}
  {{- range .Paths.JsScripts }}
    {{- if .Type}}
  <script{{if .Defer}} defer{{end}} type="{{.Type}}" src="{{.Path}}"></script>
    {{- else}}
  <script{{if .Defer}} defer{{end}} src="{{.Path}}"></script>
    {{- end}}
  {{- end }}
</head>
<body>
  <header class="header">
    {{- template "header" . }}
  </header>
  <main class="main">
    {{- template "content" . }}
  </main>
</body>
</html>
{{- end }}
