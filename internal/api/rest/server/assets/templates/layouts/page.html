{{- define "page" }}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Media Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        video {
            max-width: 80%;
            max-height: 80%;
            border: 2px solid #fff;
            border-radius: 8px;
            background: #000;
        }
    </style>
</head>
<body>
  <main class="main">
    {{- block "content" . }}{{ end }}
  </main>
</body>
</html>
{{- end }}
