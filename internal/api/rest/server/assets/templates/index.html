<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ .Title }}</title>
  <script>
    try {
      if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches)){
        document.documentElement.classList.add('dark');
      }
    } catch(e){}
  </script>
  <link rel="stylesheet" href="{{.PathStaticCss}}/variables.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="{{.PathStaticCss}}/theme-switcher.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="{{.PathStaticCss}}/style.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="{{.PathStaticCss}}/form-grab.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="{{.PathStaticCss}}/result-items.css?v={{.AppVersion}}">
  <link rel="manifest" href="{{.PathStaticPwa}}/manifest.json">
  <link rel="icon" type="image/png" sizes="16x16" href="{{.PathStaticImg}}/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{.PathStaticImg}}/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="{{.PathStaticImg}}/favicon-48.png">
  <link rel="icon" type="image/png" sizes="64x64" href="{{.PathStaticImg}}/favicon-64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{.PathStaticImg}}/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="{{.PathStaticImg}}/android-chrome-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{.PathStaticImg}}/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload"
      href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2"
      as="font"
      type="font/woff2"
      crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" id="theme-color-meta" content="#171717">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="{{.PathStaticJs}}/theme-switcher.js?v={{.AppVersion}}"></script>
  <script type="module" src="{{.PathStaticJs}}/downloader.js?v={{.AppVersion}}"></script>
</head>
<body>
  {{ template "theme-switcher.html" . }}
  <div class="div-main-area">
      <div class="div-header-main">
        <img class="img-header-logo" src="{{.PathStaticImg}}/logo-512.png">
        <h1 class="header">{{.Header}}</h1>
      </div>
      {{ template "form-grab" . }}
      {{ template "grab-result.html" . }}
  </div>
</body>
</html>
