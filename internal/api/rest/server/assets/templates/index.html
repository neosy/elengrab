<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="{{.PathStaticCss}}/style.css">
  <link rel="manifest" href="{{.PathStaticPwa}}/manifest.json">
  <link rel="icon" type="image/png" sizes="16x16" href="{{.PathStaticImg}}/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{.PathStaticImg}}/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="{{.PathStaticImg}}/favicon-48.png">
  <link rel="icon" type="image/png" sizes="64x64" href="{{.PathStaticImg}}/favicon-64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{.PathStaticImg}}/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="{{.PathStaticImg}}/android-chrome-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{.PathStaticImg}}/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/inter/v12/....woff2" as="font" type="font/woff2" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="{{.PathStaticJs}}/downloader.js"></script>
</head>
<body>
  <div class="div-main-area">
      <div class="div-header-main">
        <img class="img-header-logo" src="{{.PathStaticImg}}/logo-512.png">
        <h1 class="header">{{.Header}}</h1>
      </div>
      <form id="form-grab"
            hx-post="{{.PathDownloaderGrab}}"
            hx-target="#grab-result-item-replaceme"
            hx-include="#youtubeURL, [name='formatType']"
            hx-swap="outerHTML">
        <div class="div-grab-area">
          <input class="input-grab" type="text" id="youtubeURL" name="youtubeURL" placeholder="Enter YouTube URL" maxlength="255">
          <div class="div-button-get">
            <button type="submit" class="button-grab-get">Get</button>
            <input type="hidden" id="inputGrabF" name="hiddenInput" value="">
          </div>
        </div>
        <div class="div-format-options">
            <label>
                <input type="radio" name="formatType" value="video_mp4" checked> Video (mp4)
            </label>
            <label>
                <input type="radio" name="formatType" value="audio_mp3"> Audio (mp3)
            </label>
            <label>
                <input type="radio" name="formatType" value="audio_m4a"> Audio (m4a)
            </label>
            <label>
                <input type="radio" name="formatType" value="audio_orig"> Audio (orig)
            </label>
        </div>
      </form>
      <div class="div-grab-result" id="grab-result">
        <div class="div-grab-result-info" id="grab-result-info"></div>
        <div
          class="div-grab-result-item-replaceme"
          id="grab-result-item-replaceme"
          data-only-one="true">
        </div>
      </div>
  </div>
</body>
</html>
