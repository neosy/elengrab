<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ .Title }}</title>
  <meta name="description" content="{{ .Description }}">
  <script>
    try {
      if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches)){
        document.documentElement.classList.add('dark');
      }
    } catch(e){}
  </script>
  <link rel="stylesheet" href="{{.PathStaticCss}}/variables.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="{{.PathStaticCss}}/theme-switcher.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="{{.PathStaticCss}}/index.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="{{.PathStaticCss}}/grab-form.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="{{.PathStaticCss}}/result-rows.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="{{.PathStaticCss}}/player.css?v={{.AppVersion}}">
  <link rel="manifest" href="{{.PathStaticPwa}}/manifest.json">
  <link rel="icon" type="image/png" sizes="16x16" href="{{.PathStaticImg}}/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{.PathStaticImg}}/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="{{.PathStaticImg}}/favicon-48.png">
  <link rel="icon" type="image/png" sizes="64x64" href="{{.PathStaticImg}}/favicon-64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{.PathStaticImg}}/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="{{.PathStaticImg}}/android-chrome-512x512.png">
  <link rel="icon" type="image/x-icon" href="{{.PathStaticImg}}/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="{{.PathStaticImg}}/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="theme-color" id="theme-color-meta" content="#171717">
  <!-- <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4/dist/sse.min.js"></script>   -->
  <script src="{{.PathStaticJs}}/htmx.min.js?v={{.AppVersion}}"></script>
  <script src="{{.PathStaticJs}}/sse.min.js?v={{.AppVersion}}"></script>  
  <script defer src="{{.PathStaticJs}}/theme-switcher.js?v={{.AppVersion}}"></script>
  <script type="module" src="{{.PathStaticJs}}/index.js?v={{.AppVersion}}"></script>
</head>
<body>
  {{ template "theme-switcher.html" . }}
  <div class="div-main-area">
      <div class="div-header-main">
        <a class="header-link" href="/">
          <img class="img-header-logo" src="{{.PathStaticImg}}/logo-512.png">
          <h1 class="header">{{.Header}}</h1>
        </a>
      </div>
      {{ template "grab-form" . }}
      {{ template "grab-result.html" . }}
  </div>
  <div id="media-player-overlay">
    <div id="video-player-wrapper"></div>
  </div>
  <div id="audio-bar-container"></div>
</body>
</html>
