{{- define "result-row-success" }}
                <div class="grab-result__row success" id="{{ .RowID }}" data-media="{{ .StreamURL }}" data-is-audio="{{ .IsAudio }}">
                    <div class="result-left">
                        <span class="result__avatar" title="{{ .AvatarTitle }}">
                            <img class="result__avatar-image" src="{{ .PathDownloader }}/file/{{ .FileID }}/logo" alt="Channel avatar">
                            <button class="avatar-play__button">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M8 5v14l11-7z"/>
                                </svg>
                            </button>
                        </span>
                        <span class="result__media-url">
                            <a href="{{ .MediaURL }}" target="_blank">{{ .MediaTitle }}</a>
                        </span>
                    </div>
                    <div class="result-right">
                        <span class="result__separator first">•</span>
                        <div class="result__size">
                            <span class="result__size-value" title="Actual file size">{{ .FileSize }}</span>
                        </div>
                        <span class="result__separator">•</span>
                        <div class="result__format">
                            <span class="result__format-value" title="{{ .FormatTitle }}" data-tooltip="{{ .FormatTooltip }}" data-format="{{ .DataFormat }}">{{ .Format }}</span>
                        </div>
                        <span class="result__separator">•</span>
                        <div class="result__delete">
                            <button class="result__delete-row-button"
                                title="Delete downloaded media file"
                                hx-delete="{{ .DeleteURL }}"
                                hx-swap="none">
                                {{ .GrabResultItemDeleteIcon }}
                            </button>            
                        </div>
                        <span class="result__separator">•</span>
                        <div class="result__status">
                            <a class="result__download-link" 
                            href="{{ .DownloadURL }}" 
                            title="Download media file" download>
                            {{ .GrabResultItemStatusHtml }}
                            </a>
                        </div>
                    </div>
                </div>
{{- end }}
