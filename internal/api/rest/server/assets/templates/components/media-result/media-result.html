{{- define "media-result" }}
      <div class="media-result" id="media-result">
        <div class="media-result_info" id="result-info">
          <div class="media-result_info-row" id="result-info-row">
              <span class="media-result_info-failed" id="result-info-failed"></span>
          </div>
        </div>
        <div class="channel-header{{ if not .Values.ChannelHeader.Show }} hidden{{ end }}" id="channel-header">
          <img class="channel-header-image{{ if not .Values.ChannelHeader.ImageURL }} hidden{{ end }}" id="channel-header-image" alt="Channel avatar" src="{{ .Values.ChannelHeader.ImageURL }}">
          <div class="channel-header-content">
            <span class="channel-header-title" id="channel-header-title">{{ .Values.ChannelHeader.Title }}</span>
            <span class="channel-header-ext-username" id="channel-header-ext-username">@{{ .Values.ChannelHeader.Ext.Username }}</span>
          </div>
        </div>
        {{- template "view-mode-bar" . }}
        <div class="media-result__rows-wrapper">
        {{- template "result-rows" . }}
        </div>
      </div>
{{- end }}
