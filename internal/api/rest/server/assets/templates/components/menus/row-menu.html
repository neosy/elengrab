{{- define "row-menu" }}
<div class="row-menu menu" id="row-menu"
     data-menu-url="{{ .PathRowMenu }}"
     hx-get="{{ .PathRowMenu }}"
     hx-trigger="manual"
     hx-target="this"
     hx-swap="innerHTML">
</div>
{{- end }}

{{- define "row-menu-content" }}
  <div class="menu-actions">
    {{- range .RowMenuActions }}
    <div class="menu-action menu-action--{{ .Action }}" id="menu-action-{{ .Action }}" data-action="{{ .Action }}" data-url="{{ .URL }}">
        <div class="menu-action__content">
            {{- if .IconSvg }}
            <div class="menu-action__content-icon">
                {{ .IconSvg }}
            </div>
            {{- end }}
            <div class="menu-action__content-text">
                <span>{{ .Title }}</span>
            </div>
        </div>
    </div>
    {{- end }}
  </div>
{{- end }}
