{{- define "row-menu" }}
<div class="menu menu-row" id="row-menu"
    data-menu-url="{{ .PathRowMenu }}"
    hx-get="{{ .PathRowMenu }}"
    hx-trigger="manual"
    hx-target="this"
    hx-swap="innerHTML">
</div>
{{- end }}

{{- define "row-menu-content" }}
    <button class="menu-close"
            type="button"
            aria-label="Close menu"
            data-action="close">
        ✕
    </button>
    <div class="menu-actions">
        {{- range .RowMenuActions }}
        <div class="menu-action menu-action--{{ .Action }}" id="menu-action-{{ .Action }}" data-action="{{ .Action }}" data-url="{{ .URL }}" data-new-tab="{{ .NewTab }}">
            <div class="menu-action__content">
                {{- if .IconSvg }}
                <div class="menu-action__content-icon">
                    {{ .IconSvg }}
                </div>
                {{- end }}
                <div class="menu-action__content-text">
                    <span>{{ .Title }}</span>
                </div>
            </div>
        </div>
        {{- end }}
    </div>
{{- end }}
