{{- define "account-menu" }}
<div class="menu menu-account" id="accountMenu"
     hx-get="{{ .BasePaths.AccountMenu }}"
     hx-trigger="manual"
     hx-target="this"
     hx-swap="innerHTML">
</div>
{{- end }}

{{- define "account-menu-content" }}
  <button class="menu-close"
          type="button"
          aria-label="Close menu"
          data-action="close">
    ✕
  </button>
  <div class="menu-header">
    <div class="avatar">{{ .Extra.UserAvatarIcon }}</div>
    <div class="user-info">
      <div class="username">{{ .Extra.UserLogin }}</div>
      <div class="email">{{ .Extra.UserEmail }}</div>
    </div>
  </div>
  <div class="menu-actions">
    {{- range .Extra.AccountMenuActions }}
    <div class="menu-action menu-action--{{ .Action }}" id="menu-action-{{ .Action }}" data-action="{{ .Action }}" data-url="{{ .URL }}">
        <div class="menu-action__content">
            <div class="menu-action__content-icon">
                {{ .IconSvg }}
            </div>
            <div class="menu-action__content-text">
                <span>{{ .Title }}</span>
            </div>
        </div>
    </div>
    {{- end }}
  </div>
{{- end }}
