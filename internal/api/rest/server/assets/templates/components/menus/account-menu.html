{{- define "account-menu" }}
<div class="menu menu-account" id="accountMenu"
     hx-get="{{ .BasePaths.AccountMenu }}"
     hx-trigger="manual"
     hx-target="this"
     hx-swap="innerHTML">
</div>
{{- end }}

{{- define "account-menu-content" }}
  <button class="menu-close"
          type="button"
          aria-label="Close menu"
          data-action="close">
    ✕
  </button>
  <div class="menu-header">
    <div class="avatar">{{ .UserAvatar.Icon }}</div>
    <div class="user-info">
      <div class="username">{{ .Extra.UserLogin }}</div>
      <div class="email">{{ .Extra.UserEmail }}</div>
    </div>
  </div>
  {{- template "menu-actions" . }} 
{{- end }}
