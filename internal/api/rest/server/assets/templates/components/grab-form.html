{{- define "grab-form" }}
      <form class="grab-form" id="grabForm"
            method="post"
            hx-post="{{.BasePaths.DownloaderGrab}}"
            hx-include="#mediaURLInput, [name='formatType']"
            hx-swap="none">
        <div class="url-input-container">
          <div class="url-input-wrapper">
            <input class="url-input" type="url" id="mediaURLInput" name="mediaURL" placeholder="{{ .Values.GrabForm.InputPlaceholder }}" maxlength="2048">
          </div>
          <div class="url-input-actions">
            <button class="url-input-action-button grab-area__action-button--paste no-select" type="button"></button>
            <button class="url-input-action-button grab-area__action-button--settings no-select" type="button" aria-expanded="true">{{ .Values.GrabForm.SettingsButtonIcon }}</button>
          </div>
          <div class="url-input-buttons">
            <button type="submit" class="url-input-button no-select" title="Download media">{{ .Values.GrabForm.GetButtonIcon }}<span>{{ .Values.GrabForm.GetButtonTitle }}</span></button>
          </div>
        </div>
        {{- block "download-options" . }}{{- end }}
      </form>
{{- end }}
