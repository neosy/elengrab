{{- define "media-result-source-link" }}
                        <div class="media-result__source">
                            {{- if .Values.MediaURL }}
                            <a class="media-result__source-link" href="{{ .Values.MediaURL }}" target="_blank" rel="noopener noreferrer" title="Original source link">{{ .Values.DownloaderResultItemSourceLinkIcon }}</a>
                            {{- else }}
                            <span class="media-result__source-link media-result__source-link--disabled" aria-disabled="true" title="Source link is unavailable" data-tooltip="Source link is unavailable">{{ .Values.DownloaderResultItemSourceLinkIcon }}</span>
                            {{- end }}
                        </div>
{{- end }}
