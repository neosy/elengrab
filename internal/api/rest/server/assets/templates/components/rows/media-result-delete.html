{{- define "media-result-delete" }}
                        {{- $title := "Delete downloaded media file" }}
                        {{- if ne .DownloadStatus "done" }}
                            {{- $title = "Delete this download task" }}
                        {{- end }}
                        <div class="media-result__delete">
                            <button class="media-result__delete-row-button"
                                title="{{ $title }}"
                                hx-delete="{{ .DeleteURL }}"
                                hx-swap="none">
                                {{ .GrabResultItemDeleteIcon }}
                            </button>            
                        </div>
{{- end }}
