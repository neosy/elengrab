{{- define "media-result-row-thumbnail" }}
                    {{- if .Values.ThumbnailURL }}
                        {{- $cssClass := "" -}}
                        {{- if .Values.ThumbnailIsPortrait -}}
                            {{- $cssClass = " thumbnail--portrait" -}}
                        {{- end -}}
                    <div class="media-result__row-thumbnail full-bleed{{ $cssClass }}">
                        <button class="media-result__thumbnail-play-button media-result__play-button" data-watch-url="{{ .Values.WatchURL }}">
                            <div class="media-result__thumbnail-bg">
                                <img src="{{ .Values.ThumbnailURL }}" alt="" aria-hidden="true">
                            </div>    
                            <div class="media-result__thumbnail-image__wrapper">
                                <img class="media-result__thumbnail-image" src="{{ .Values.ThumbnailURL }}" alt="Video thumbnail">
                                <div class="media-result__thumbnail-duration">{{ .Values.Duration }}</div>
                                {{- if gt .Values.WatchPercent 0.0 }}
                                <div class="media-result__thumbnail-watch-progress">
                                    <div class="media-result__thumbnail-watch-progress-value" style="--watch-progress: {{ printf `%.2f` .Values.WatchPercent }}%"></div>
                                </div>
                                {{- end }}
                                <div class="media-result__thumbnail-overlay">
                                    <div class="media-result__refreshing-icon-bg"></div>
                                    <div class="media-result__refreshing-loader"></div>
                                    <div class="media-result__refreshing-icon">
                                        {{ .Values.RefreshingIcon }}
                                    </div>
                                </div>
                            </div>
                        </button>
                    </div>
                    {{- end }}
{{- end }}
