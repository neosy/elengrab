{{- define "media-result-row-thumbnail" }}
                    {{- if .Values.ThumbnailID }}
                        {{- $cssClass := "" -}}
                        {{- if .Values.ThumbnailIsPortrait -}}
                            {{- $cssClass = " thumbnail--portrait" -}}
                        {{- end -}}
                    <div class="media-result__row-thumbnail full-bleed{{ $cssClass }}">
                        <button class="media-result__thumbnail-play-button media-result__play-button" data-watch-url="{{ .Values.WatchURL }}">
                            <div class="media-result__thumbnail-image__wrapper">
                                <img class="media-result__thumbnail-image" src="{{ .BasePaths.StaticThumbnails }}/{{ .Values.ThumbnailID }}" alt="Video thumbnail">
                                <div class="media-result__thumbnail-duration">{{ .Values.Duration }}</div>
                            </div>
                        </button>
                    </div>
                    {{- end }}
{{- end }}
