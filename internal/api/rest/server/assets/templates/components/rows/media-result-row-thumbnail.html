{{- define "media-result-row-thumbnail" }}
                    {{- if .Values.ThumbnailURL }}
                        {{- $cssClass := "" -}}
                        {{- if .Values.ThumbnailIsPortrait -}}
                            {{- $cssClass = " thumbnail--portrait" -}}
                        {{- end -}}
                    <div class="media-result__row-thumbnail full-bleed{{ $cssClass }}">
                        <button class="media-result__thumbnail-play-button media-result__play-button" data-watch-url="{{ .Values.WatchURL }}">
                            <div class="media-result__thumbnail-bg">
                                {{- if .Values.LazyLoadImages }}
                                <div class="media-result__thumbnail-placeholder"></div>
                                {{- end }}
                                <img {{ if .Values.LazyLoadImages }}data-src{{ else }}src{{ end }}="{{ .Values.ThumbnailURL }}" alt="" aria-hidden="true">
                            </div>    
                            <div class="media-result__thumbnail-image__wrapper">
                                {{- if .Values.LazyLoadImages }}
                                <div class="media-result__thumbnail-placeholder"></div>
                                {{- end }}
                                <img class="media-result__thumbnail-image" {{ if .Values.LazyLoadImages }}data-src{{ else }}src{{ end }}="{{ .Values.ThumbnailURL }}" style="--thumbnail-image-width: {{.Values.ThumbnailWidth}}; --thumbnail-image-height: {{.Values.ThumbnailHeight}}; --thumbnail-image-aspect-ratio: {{.Values.ThumbnailAspectRatio}};" alt="Video thumbnail">
                                <div class="media-result__thumbnail-duration">
                                    {{- if .Values.AudioIcon }}
                                    <span class="media-result__thumbnail-duration-icon">
                                        {{ .Values.AudioIcon }}
                                    </span>
                                    {{- end }}
                                    <span class="media-result__thumbnail-duration-value">{{ .Values.Duration }}</span>
                                </div>
                                <div class="media-result__thumbnail-watched{{- if not .Values.Watched }} hidden{{- end }}">{{ .Values.WatchedIcon }}</div>
                                {{- if .Values.WatchIndicatorEnabled }}
                                <div class="media-result__thumbnail-watch-progress{{if eq .Values.WatchPercent 0.0 }} hidden{{end }}">
                                    <div class="media-result__thumbnail-watch-progress-value" style="--watch-progress: {{ printf `%.2f` .Values.WatchPercent }}%"></div>
                                </div>
                                {{- end }}
                                <div class="media-result__thumbnail-overlay">
                                    <div class="media-result__refreshing-icon-bg"></div>
                                    <div class="media-result__refreshing-loader"></div>
                                    <div class="media-result__refreshing-icon">
                                        {{ .Values.RefreshingIcon }}
                                    </div>
                                </div>
                            </div>
                        </button>
                    </div>
                    {{- end }}
{{- end }}
