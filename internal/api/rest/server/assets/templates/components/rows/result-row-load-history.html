{{- define "result-row-load-history" }}
    <div class="media-result__row-load-history" id="row-load-history"
{{- if not .Extra.DisableHTMXEvent }}
    hx-get="{{.BasePaths.DownloaderHistory}}"
    hx-trigger="revealed once"
    hx-target="this"
    hx-swap="outerHTML"
{{- end }}>
        <span class="media-result__row-history-loading">
            <span class="media-result__row-history-spinner"></span>
        </span>
    </div>
{{- end }}
