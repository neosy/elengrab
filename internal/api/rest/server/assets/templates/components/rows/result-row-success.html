{{- define "result-row-success" }}
                <div class="grab-result__row success" id="{{ .RowID }}" data-media="{{ .StreamURL }}" data-is-audio="{{ .IsAudio }}">
                    <div class="result-left">
                        <span class="result__avatar" title="{{ .AvatarTitle }}">
                            {{- if .ThumbnailID }}
                                <img class="result__avatar-image" src="{{ .PathStaticThumbnail }}/{{ .ThumbnailID }}" alt="Video thumbnail">
                            {{- else if and .YoutubeChannelID (ne .YoutubeChannelID "none") }}
                                <img class="result__avatar-image" src="{{ .PathStaticYoutubeChannel }}/{{ .YoutubeChannelID }}" alt="Video thumbnail">
                            {{- else }}
                                <img class="result__avatar-image" src="{{ .PathDownloader }}/file/{{ .FileID }}/logo" alt="Channel avatar">
                            {{- end }}
                            <button class="avatar-play__button" data-watch-url="{{ .WatchURL }}">
                                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M21.4086 9.35258C23.5305 10.5065 23.5305 13.4935 21.4086 14.6474L8.59662 21.6145C6.53435 22.736 4 21.2763 4 18.9671L4 5.0329C4 2.72368 6.53435 1.26402 8.59661 2.38548L21.4086 9.35258Z" fill="currentColor"/>
                                </svg>                                
                            </button>
                        </span>
                        <span class="result__media-url">
                            <a href="{{ .MediaURL }}" target="_blank">{{ .MediaTitle }}</a>
                        </span>
                    </div>
                    <div class="result-right">
                        <span class="result__separator first">•</span>
                        <div class="result__size">
                            <span class="result__size-value" title="Actual file size">{{ .FileSize }}</span>
                        </div>
                        <span class="result__separator">•</span>
                        <div class="result__format">
                            <span class="result__format-value" title="{{ .FormatTitle }}" data-tooltip="{{ .FormatTooltip }}" data-format="{{ .DataFormat }}">{{ .Format }}</span>
                        </div>
                        <span class="result__separator">•</span>
                        <div class="result__delete">
                            <button class="result__delete-row-button"
                                title="Delete downloaded media file"
                                hx-delete="{{ .DeleteURL }}"
                                hx-swap="none">
                                {{ .GrabResultItemDeleteIcon }}
                            </button>            
                        </div>
                        <span class="result__separator">•</span>
                        <div class="result__status">
                            <a class="result__download-link" 
                            href="{{ .DownloadURL }}" 
                            title="Download media file" download>
                            {{ .ResultRowStatusIcon }}
                            </a>
                        </div>
                        <div class="result__menu">
                            <button type="button" class="result__menu-button" aria-label="Open the action menu" data-file-id="{{ .FileID }}">
                                <span class="dot"></span>
                                <span class="dot"></span>
                                <span class="dot"></span>
                            </button>
                        </div>
                    </div>
                </div>
{{- end }}
