{{- define "result-row-success" }}
                <div class="media-result__row success" id="{{ .RowID }}" data-media="{{ .StreamURL }}" data-is-audio="{{ .IsAudio }}">
                    {{- if .ThumbnailID }}
                    <div class="media-result__row-thumbnail full-bleed">
                        <button class="media-result__thumbnail-play-button media-result__play-button" data-watch-url="{{ .WatchURL }}">
                            <div class="media-result__thumbnail-image__wrapper">
                                <img class="media-result__thumbnail-image" src="{{ .PathStaticThumbnail }}/{{ .ThumbnailID }}" alt="Video thumbnail">
                            </div>
                        </button>
                    </div>
                    {{- end }}
                    <div class="media-result__row-content">
                        <span class="media-result__avatar" title="{{ .AvatarTitle }}">
                            <img class="media-result__avatar-image" src="{{ .ImageURL }}">
                            <img class="media-result__avatar-image--avatar" src="{{ .ImageAvatarURL }}">
                            <button class="media-result__avatar-play-button media-result__play-button" data-watch-url="{{ .WatchURL }}">
                                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M21.4086 9.35258C23.5305 10.5065 23.5305 13.4935 21.4086 14.6474L8.59662 21.6145C6.53435 22.736 4 21.2763 4 18.9671L4 5.0329C4 2.72368 6.53435 1.26402 8.59661 2.38548L21.4086 9.35258Z" fill="currentColor"/>
                                </svg>                                
                            </button>
                        </span>
                        <span class="media-result__title">
                            <a class="media-result__title-link" href="{{ .MediaURL }}" target="_blank">{{ .MediaTitle }}</a>
                        </span>
                    </div>
                    <div class="media-result__row-meta">
                        <div class="media-result__size">
                            <span class="media-result__size-value" title="Actual file size">{{ .FileSize }}</span>
                        </div>
                        <div class="media-result__format">
                            <div class="media-result__format-value__wrapper"><span class="media-result__format-value" title="{{ .FormatTitle }}" data-tooltip="{{ .FormatTooltip }}" data-format="{{ .DataFormat }}">{{ .Format }}</span></div>
                        </div>
                        <div class="media-result__delete">
                            <button class="media-result__delete-row-button"
                                title="Delete downloaded media file"
                                hx-delete="{{ .DeleteURL }}"
                                hx-swap="none">
                                {{ .GrabResultItemDeleteIcon }}
                            </button>            
                        </div>
                        <div class="media-result__status">
                            <a class="media-result__download-link" 
                            href="{{ .DownloadURL }}" 
                            title="Download media file" download>
                            {{ .ResultRowStatusIcon }}
                            </a>
                        </div>
                        <div class="media-result__menu">
                            <button type="button" class="media-result__menu-button" aria-label="Open the action menu" data-file-id="{{ .FileID }}">
                                <span class="dot"></span>
                                <span class="dot"></span>
                                <span class="dot"></span>
                            </button>
                        </div>
                    </div>
                </div>
{{- end }}
