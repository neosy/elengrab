{{- define "media-player" }}
    <div class="media-player" id="media-player">
        <div class="media-player__video" id="media-player-video">
            <div class="media-player__wrapper">
                <video class="media-player__video-player" disablepictureinpicture src=""></video>
                <div class="media-player__controls media-player__controls--horizontal">
                    <button class="media-player__control media-player__control--minimize" title="Minimize player" aria-label="Minimize player">{{ .Values.VideoPlayerMinimizeIcon }}</button>
                    <button class="media-player__control media-player__control--close" title="Close player" aria-label="Close player">×</button>
                </div>
            </div>
        </div>
        <div class="media-player__audio" id="media-player-audio">
            <div class="media-player__wrapper">
                <audio class="media-player__audio-player" src=""></audio>
                <div class="media-player__controls media-player__controls--horizontal">
                    <button class="media-player__control media-player__control--close" aria-label="Close audio player">×</button>
                </div>
            </div>
        </div>
    </div>       
    <div class="media-player__playing-overlay media-player__playing-overlay--video" id="media-player-video-playing-overlay">
        <div class="playing-overlay__icon playing-overlay__icon--video">
            {{ .Values.VideoPlayingIcon }}
        </div>
        <div class="playing-overlay__duration">
            <span class="playing-overlay__duration-value">0:00</span>
        </div>
        <div class="playing-overlay__play-icon">
            {{ .Values.PlayIcon }}
        </div>
        <div class="playing-overlay__progress">
            <div class="playing-overlay__progress-value" style="--watch-progress: 0.00%"></div>
        </div>
    </div>     
    <div class="media-player__playing-overlay media-player__playing-overlay--audio" id="media-player-audio-playing-overlay">
        <div class="playing-overlay__icon playing-overlay__icon--audio">
            {{ .Values.AudioPlayingIcon }}
        </div>
        <div class="playing-overlay__duration">
            <span class="playing-overlay__duration-icon playing-overlay__duration-icon--audio">
                {{ .Values.AudioNoteIcon }}
            </span>
            <span class="playing-overlay__duration-value">0:00</span>
        </div>
        <div class="playing-overlay__play-icon">
            {{ .Values.PlayIcon }}
        </div>
        <div class="playing-overlay__pause-icon">
            {{ .Values.PauseIcon }}
        </div>
        <div class="playing-overlay__progress">
            <div class="playing-overlay__progress-value" style="--watch-progress: 0.00%"></div>
        </div>
    </div>
{{- end }}
