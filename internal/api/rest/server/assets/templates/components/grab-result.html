{{- define "grab-result" }}
      <div class="grab-result" id="grab-result">
        <div class="grab-result_info" id="result-info">
          <div class="grab-result_info-row" id="result-info-row">
              <span class="grab-result_info-failed" id="result-info-failed"></span>
          </div>
        </div>
        {{- if .ShowHistorySearch }}
          <div class="result-toolbar">
            {{- template "history-search" . }}
          </div>
        {{- end }}
        <div class="grab-result__rows-wrapper">
          {{- template "result-rows" . }}
          {{- template "row-menu" . }}
        </div>
      </div>
{{- end }}
