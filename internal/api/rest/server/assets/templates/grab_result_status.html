<div class="div-grab-result-item" {{.GrabResultItemHtmxOption}}>
    <span class="result-youtube-url">
        <a href="{{.YoutubeURL}}" target="_blank">{{.YoutubeTitle}}</a>
    </span>
    <div class="result-right">
        <span class="result-separator first">•</span>
        <div class="div-result-size">
            <span class="result-size" data-id="size">{{.FileSize}}</span>
        </div>
        <span class="result-separator">•</span>
        <div class="div-result-format">
            <span class="result-format" data-id="format">{{.Format}}</span>
        </div>
        <span class="result-separator">•</span>
        <!-- <div class="div-result-status" hx-get="{{.PathStaticIcons}}/{{.GrabResultStatusIconName}}" hx-trigger="load" hx-target="this" hx-swap="innerHTML"> -->
        <div class="div-result-status" title="{{.GrabResultItemStatusText}}">{{.GrabResultItemStatusHtml}}</div>
        </div>
    </div>
</div>
