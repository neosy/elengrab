<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/img/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/img/android-chrome-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
  <script src="https://unpkg.com/htmx.org@1.9.3"></script>
  <script src="/static/js/downloader.js"></script>
</head>
<body>
  <div class="grab-area">
      <h1 class="header">{{.Header}}</h1>
      <div class="search-wrapper">
        <input class="grab-input" type="text" id="youtubeURL" name="youtubeURL" placeholder="Enter YouTube URL" maxlength="200" pattern="https?://(www\.)?youtube\.com/watch\?v=[\w-]+">
        <button class="button-grab-get" hx-post="/downloader/grab" hx-target="#grab-result" hx-include="#youtubeURL, [name='formatType']">Get</button>
      </div>
      <div class="format-options">
          <label>
              <input type="radio" name="formatType" value="video_mp4" checked> Video (mp4)
          </label>
          <label>
              <input type="radio" name="formatType" value="audio_mp3"> Audio (mp3)
          </label>
          <label>
              <input type="radio" name="formatType" value="audio_m4a"> Audio (m4a)
          </label>
          <label>
              <input type="radio" name="formatType" value="audio_orig"> Audio (orig)
          </label>
      </div>
      <div class="grab-result" id="grab-result"></div>
  </div>
</body>
</html>
