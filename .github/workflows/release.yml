name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (example: v0.9.5)'
        required: false
      prerelease:
        description: 'Create prerelease?'
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            os_name: linux
            goarch: amd64
            arch_name: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            os_name: linux
            goarch: arm64
            arch_name: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            os_name: win
            goarch: amd64
            arch_name: x64
            ext: ".exe"
            archive: zip
          # - goos: darwin
          #   os_name: mac
          #   goarch: amd64
          #   arch_name: x64
          #   ext: ""
          #   archive: zip
          # - goos: darwin
          #   os_name: mac
          #   goarch: arm64
          #   arch_name: arm64
          #   ext: ""
          #   archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build tag
        id: build_tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Tag must be provided when running from a branch."
            exit 1
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set version
        id: version
        run: |
          TAG="${{ steps.build_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install rsrc
        if: matrix.goos == 'windows'
        run: go install github.com/akavel/rsrc@latest

      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        run: |
          cd cmd/server
          rsrc -ico icon.ico
          
      - name: Build
        run: |
          SUFFIX=""
          if [[ "${{ matrix.os_name }}" == "win" || "${{ matrix.os_name }}" == "mac" ]]; then
            SUFFIX="-${{ steps.version.outputs.version }}"
          fi

          TARGET_DIR="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${TARGET_DIR}"
                    
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -tags embed_assets \
            -o "${TARGET_DIR}/elengrab${SUFFIX}-${{ matrix.os_name }}-${{ matrix.arch_name }}${{ matrix.ext }}" ./cmd/server

      - name: Archive
        run: |
          SUFFIX=""
          if [[ "${{ matrix.os_name }}" == "win" || "${{ matrix.os_name }}" == "mac" ]]; then
            SUFFIX="-${{ steps.version.outputs.version }}"
          fi

          TARGET_DIR="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          cd "${TARGET_DIR}"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r elengrab${SUFFIX}-${{ matrix.os_name }}-${{ matrix.arch_name }}.zip elengrab${SUFFIX}-${{ matrix.os_name }}-${{ matrix.arch_name }}${{ matrix.ext }}
          else
            tar -czf elengrab${SUFFIX}-${{ matrix.os_name }}-${{ matrix.arch_name }}.tar.gz elengrab${SUFFIX}-${{ matrix.os_name }}-${{ matrix.arch_name }}${{ matrix.ext }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elengrab-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.goos }}-${{ matrix.goarch }}/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Tag must be provided when running from a branch."
            exit 1
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set release name
        id: release_name
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          NAME="${TAG}"
          echo "name=${NAME}" >> $GITHUB_OUTPUT

      - name: Extract release notes from RELEASE.md
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"

          if ! grep -q "## $TAG" RELEASE.md; then
            echo "Release notes for $TAG not found in RELEASE.md"
            exit 1
          fi

          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          awk "/## $TAG/{flag=1;next}/## v/{flag=0}flag" RELEASE.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download linux-amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: elengrab-binaries-linux-amd64
          path: dist/linux-amd64

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: elengrab-binaries-linux-arm64
          path: dist/linux-arm64

      - name: Download windows-amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: elengrab-binaries-windows-amd64
          path: dist/windows-amd64

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_name.outputs.name }}
          body: ${{ steps.notes.outputs.BODY }}
          prerelease: ${{ github.event.inputs.prerelease }}
          draft: false
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
