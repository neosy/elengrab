name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (example: v0.24.1)'
        required: false
      prerelease:
        description: 'Create prerelease?'
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        include:
          - goos: linux
            os_name: linux
            goarch: amd64
            arch_name: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            os_name: linux
            goarch: arm64
            arch_name: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            os_name: win
            goarch: amd64
            arch_name: x64
            ext: ".exe"
            archive: zip
          - goos: darwin
            os_name: mac
            goarch: amd64
            arch_name: x64
            ext: ""
            archive: zip
          - goos: darwin
            os_name: mac
            goarch: arm64
            arch_name: arm64
            ext: ""
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve build tag
        id: build_tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Tag must be provided when running from a branch."
            exit 1
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set version
        id: version
        run: |
          TAG="${{ steps.build_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install rsrc
        if: matrix.goos == 'windows'
        run: go install github.com/akavel/rsrc@latest

      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        run: |
          cd cmd/server
          rsrc -ico icon.ico
          
      - name: Download Linux dependencies
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          case "${{ matrix.goarch }}" in
            amd64)
              FFMPEG_ARCHIVE="ffmpeg-master-latest-linux64-gpl.tar.xz"
              YTDLP_BINARY="yt-dlp_linux"
              ;;
            arm64)
              FFMPEG_ARCHIVE="ffmpeg-master-latest-linuxarm64-gpl.tar.xz"
              YTDLP_BINARY="yt-dlp_linux_aarch64"
              ;;
            *)
              echo "Unsupported Linux architecture: ${{ matrix.goarch }}"
              exit 1
              ;;
          esac

          FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${FFMPEG_ARCHIVE}"
          YTDLP_URL="https://github.com/yt-dlp/yt-dlp/releases/latest/download/${YTDLP_BINARY}"

          TARGET_DIR="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          LICENSE_DIR="${TARGET_DIR}/LICENSES"

          mkdir -p "${TARGET_DIR}"
          mkdir -p "${LICENSE_DIR}"

          echo "Downloading FFmpeg..."
          curl -L --fail --retry 3 \
            -o /tmp/ffmpeg.tar.xz \
            "${FFMPEG_URL}"

          echo "Extracting FFmpeg..."
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp

          FFMPEG_DIR="$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-*' | head -n 1)"

          if [ -z "${FFMPEG_DIR}" ]; then
            echo "FFmpeg directory not found."
            exit 1
          fi

          cp "${FFMPEG_DIR}/bin/ffmpeg" "${TARGET_DIR}/ffmpeg"
          cp "${FFMPEG_DIR}/bin/ffprobe" "${TARGET_DIR}/ffprobe"

          echo "Downloading FFmpeg licenses..."
          find "${FFMPEG_DIR}" -type f \
            \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) \
            -exec sh -c 'cp "$1" "'"${LICENSE_DIR}"'/ffmpeg-$(basename "$1")"' _ {} \;            

          echo "Downloading yt-dlp..."
          curl -L --fail --retry 3 \
            -o "${TARGET_DIR}/yt-dlp" \
            "${YTDLP_URL}"

          chmod +x \
            "${TARGET_DIR}/ffmpeg" \
            "${TARGET_DIR}/ffprobe" \
            "${TARGET_DIR}/yt-dlp"

          YTDLP_VERSION="$(curl -fsSL --retry 3 --retry-delay 2 \
            https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest |
            sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')"

          if [ -z "${YTDLP_VERSION}" ]; then
            echo "Unable to determine yt-dlp version."
            exit 1
          fi

          echo "yt-dlp version: ${YTDLP_VERSION}"

          echo "Downloading yt-dlp licenses..."
          curl -L --fail --retry 3 \
            -o "${LICENSE_DIR}/yt-dlp-LICENSE.txt" \
            "https://raw.githubusercontent.com/yt-dlp/yt-dlp/${YTDLP_VERSION}/LICENSE"

          curl -L --fail --retry 3 \
            -o "${LICENSE_DIR}/yt-dlp-THIRD_PARTY_LICENSES.txt" \
            "https://raw.githubusercontent.com/yt-dlp/yt-dlp/${YTDLP_VERSION}/THIRD_PARTY_LICENSES.txt"
            
          echo "Creating Elengrab license..."
          cp LICENSE "${LICENSE_DIR}/elengrab-LICENSE.txt"

      - name: Download Windows dependencies
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          FFMPEG_ARCHIVE="ffmpeg-master-latest-win64-gpl.zip"
          YTDLP_BINARY="yt-dlp.exe"

          FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${FFMPEG_ARCHIVE}"
          YTDLP_URL="https://github.com/yt-dlp/yt-dlp/releases/latest/download/${YTDLP_BINARY}"

          TARGET_DIR="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          LICENSE_DIR="${TARGET_DIR}/LICENSES"

          mkdir -p "${TARGET_DIR}"
          mkdir -p "${LICENSE_DIR}"

          echo "Downloading FFmpeg..."
          curl -L --fail --retry 3 \
            -o /tmp/ffmpeg.zip \
            "${FFMPEG_URL}"

          echo "Extracting FFmpeg..."
          unzip -q /tmp/ffmpeg.zip -d /tmp

          FFMPEG_DIR="$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-*' | head -n 1)"

          if [ -z "${FFMPEG_DIR}" ]; then
            echo "FFmpeg directory not found."
            exit 1
          fi

          cp "${FFMPEG_DIR}/bin/ffmpeg.exe" "${TARGET_DIR}/ffmpeg.exe"
          cp "${FFMPEG_DIR}/bin/ffprobe.exe" "${TARGET_DIR}/ffprobe.exe"

          echo "Downloading FFmpeg licenses..."
          find "${FFMPEG_DIR}" -type f \
            \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) \
            -exec sh -c 'cp "$1" "'"${LICENSE_DIR}"'/ffmpeg-$(basename "$1")"' _ {} \;

          echo "Downloading yt-dlp..."
          curl -L --fail --retry 3 \
            -o "${TARGET_DIR}/yt-dlp.exe" \
            "${YTDLP_URL}"

          YTDLP_VERSION="$(curl -fsSL --retry 3 --retry-delay 2 \
            https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest |
            sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')"

          if [ -z "${YTDLP_VERSION}" ]; then
            echo "Unable to determine yt-dlp version."
            exit 1
          fi

          echo "yt-dlp version: ${YTDLP_VERSION}"

          echo "Downloading yt-dlp licenses..."
          curl -L --fail --retry 3 \
            -o "${LICENSE_DIR}/yt-dlp-LICENSE.txt" \
            "https://raw.githubusercontent.com/yt-dlp/yt-dlp/${YTDLP_VERSION}/LICENSE"

          curl -L --fail --retry 3 \
            -o "${LICENSE_DIR}/yt-dlp-THIRD_PARTY_LICENSES.txt" \
            "https://raw.githubusercontent.com/yt-dlp/yt-dlp/${YTDLP_VERSION}/THIRD_PARTY_LICENSES.txt"

          echo "Creating Elengrab license..."
          cp LICENSE "${LICENSE_DIR}/elengrab-LICENSE.txt"

      - name: Build
        run: |
          SUFFIX=""
          if [[ "${{ matrix.os_name }}" == "win" || "${{ matrix.os_name }}" == "mac" ]]; then
            SUFFIX="-${{ steps.version.outputs.version }}"
          fi

          TARGET_DIR="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${TARGET_DIR}"

          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -tags embed_assets \
            -o "${TARGET_DIR}/elengrab${SUFFIX}-${{ matrix.os_name }}-${{ matrix.arch_name }}${{ matrix.ext }}" ./cmd/server

      - name: Archive
        run: |
          SUFFIX=""
          if [[ "${{ matrix.os_name }}" == "win" || "${{ matrix.os_name }}" == "mac" ]]; then
            SUFFIX="-${{ steps.version.outputs.version }}"
          fi

          TARGET_DIR="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          cd "${TARGET_DIR}"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r elengrab${SUFFIX}-${{ matrix.os_name }}-${{ matrix.arch_name }}.zip elengrab${SUFFIX}-${{ matrix.os_name }}-${{ matrix.arch_name }}${{ matrix.ext }}
          else
            tar -czf elengrab${SUFFIX}-${{ matrix.os_name }}-${{ matrix.arch_name }}.tar.gz elengrab${SUFFIX}-${{ matrix.os_name }}-${{ matrix.arch_name }}${{ matrix.ext }}
          fi

      - name: Create Linux bundle
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          TARGET_DIR="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          BINARY="elengrab-${{ matrix.os_name }}-${{ matrix.arch_name }}"
          BUNDLE="elengrab-${{ matrix.os_name }}-${{ matrix.arch_name }}-bundle.tar.gz"

          cd "${TARGET_DIR}"

          tar -czf "${BUNDLE}" \
            "${BINARY}" \
            ffmpeg \
            ffprobe \
            yt-dlp \
            LICENSES

      - name: Create Windows bundle
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          TARGET_DIR="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          BINARY="elengrab-${{ steps.version.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch_name }}.exe"
          BUNDLE="elengrab-${{ steps.version.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch_name }}-bundle.zip"          

          cd "${TARGET_DIR}"

          zip -r "${BUNDLE}" \
            "${BINARY}" \
            ffmpeg.exe \
            ffprobe.exe \
            yt-dlp.exe \
            LICENSES

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: elengrab-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.goos }}-${{ matrix.goarch }}/*

  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Tag must be provided when running from a branch."
            exit 1
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set release name
        id: release_name
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          NAME="${TAG}"
          echo "name=${NAME}" >> $GITHUB_OUTPUT

      - name: Extract release notes from RELEASE.md
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"

          if ! grep -q "## $TAG" RELEASE.md; then
            echo "Release notes for $TAG not found in RELEASE.md"
            exit 1
          fi

          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          awk "/## $TAG/{flag=1;next}/## v/{flag=0}flag" RELEASE.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download linux-amd64 artifact
        uses: actions/download-artifact@v8
        with:
          name: elengrab-binaries-linux-amd64
          path: dist/linux-amd64

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: elengrab-binaries-linux-arm64
          path: dist/linux-arm64

      - name: Download windows-amd64 artifact
        uses: actions/download-artifact@v8
        with:
          name: elengrab-binaries-windows-amd64
          path: dist/windows-amd64

      - name: Download darwin-amd64 artifact
        uses: actions/download-artifact@v8
        with:
          name: elengrab-binaries-darwin-amd64
          path: dist/darwin-amd64

      - name: Download darwin-arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: elengrab-binaries-darwin-arm64
          path: dist/darwin-arm64
          
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_name.outputs.name }}
          body: ${{ steps.notes.outputs.BODY }}
          prerelease: ${{ github.event.inputs.prerelease }}
          draft: false
          files: |
            dist/linux-amd64/elengrab-linux-amd64
            dist/linux-amd64/elengrab-linux-*.gz
            dist/linux-arm64/elengrab-linux-arm64
            dist/linux-arm64/elengrab-linux-*.gz
            dist/windows-amd64/elengrab-*.exe
            dist/windows-amd64/elengrab-*.zip
            dist/darwin-amd64/elengrab-*-mac-x64
            dist/darwin-amd64/elengrab-*.zip
            dist/darwin-arm64/elengrab-*-mac-arm64
            dist/darwin-arm64/elengrab-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}